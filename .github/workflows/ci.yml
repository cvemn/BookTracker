name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  VITE_APK_URL: https://github.com/${{ github.repository }}/releases/download/android-latest/dogear.apk
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk dogear.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dogear-android
          path: dogear.apk

  # On main: publish the website and attach the APK to an "Android app" release.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: dogear-android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Dogear for Android
          body: Download `dogear.apk` on your Android phone and open it to install.
          prerelease: false
          files: dogear.apk
